spring.application.name=price-fetcher
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSX,UTC} %-5level service=${spring.application.name:price-fetcher} traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-} userId=%X{userId:-} [%thread] %logger{36} - %msg%n
management.server.port=${SERVER_PORT:8081}

# --- Proveedor principal: FINNHUB o POLYGON ---
pricefetcher.providers.primary=FINNHUB

# --- Finnhub ---
pricefetcher.providers.finnhub.base-url=https://finnhub.io/api/v1
pricefetcher.providers.finnhub.api-key=${FINNHUB_API_KEY:}

# --- Polygon ---
pricefetcher.providers.polygon.base-url=https://api.polygon.io
pricefetcher.providers.polygon.api-key=${POLYGON_API_KEY:}

# --- Configuración de mercado ---
pricefetcher.market.timezone=America/New_York
pricefetcher.market.schedule.premarket=06:00-09:30
pricefetcher.market.schedule.regular=09:30-16:00
pricefetcher.market.schedule.after=16:00-20:00

# --- Configuración de cotizaciones ---
pricefetcher.quotes.refresh-ms=2000
pricefetcher.quotes.ttl-seconds=45

# --- Configuración de seguridad ---
# JWT Configuration (Auth0 example)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://your-domain.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audience=${JWT_AUDIENCE:your-api-identifier}

spring.profiles.active=auth

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.newrelic.api-key=${NEW_RELIC_API_KEY:}
management.newrelic.account-id=${NEW_RELIC_ACCOUNT_ID:}
management.newrelic.uri=${NEW_RELIC_METRICS_URI:https://insights-collector.newrelic.com}
management.newrelic.step=1m
