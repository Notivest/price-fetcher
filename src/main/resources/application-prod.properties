# Configuración para producción - Con autenticación completa
pricefetcher.security.enabled=true
pricefetcher.security.audit.enabled=true
pricefetcher.security.jwt.enabled=true


# Auth0 Configuration (set via environment variables)
# AUTH0_DOMAIN=your-domain.auth0.com

# Logs de seguridad en producción
logging.level.com.notivest.pricefetcher.security=INFO
logging.level.org.springframework.security=WARN

# Configuración de producción
spring.profiles.active=prod
